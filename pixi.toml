[workspace]
authors = ["jgsimard <jeangab23@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge", "https://repo.prefix.dev/modular-community"]
name = "learn_mojo"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
aoc25 = "python -c \"import os, sys; [sys.exit(1) for i in range(1, 13) if os.system(f'mojo aoc/2025/d{i}/d{i}.mojo') != 0]\""


[dependencies]
mojo = ">=1.0.0b2.dev2026060606,<2"
max = ">=26.4.0.dev2026060606,<27"
python = ">=3.13.13,<3.14"
numpy = ">=2.4.6,<3"
polars = ">=1.41.2,<2"
tqdm = ">=4.68.1,<5"
pillow = ">=12.2.0,<13"
pygame = ">=2.6.1,<3"
